<head>

    <style>

        :root {

            --bg-base: #09090b;

            --bg-surface: #18181b;

            --bg-surface-hover: #27272a;

            --glass-bg: rgba(24, 24, 27, 0.7);

            --border: #3f3f46;

            --text-main: #f4f4f5;

            --text-muted: #a1a1aa;

            --accent-primary: #10b981; /* Emerald */

            --accent-glow: rgba(16, 185, 129, 0.2);

            --danger: #ef4444;

            --font-sans: 'Inter', sans-serif;

            --font-head: 'Outfit', sans-serif;

            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

        }



        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

        }



        body {

            background-color: var(--bg-base);

            color: var(--text-main);

            font-family: var(--font-sans);

            line-height: 1.6;

            -webkit-font-smoothing: antialiased;

            overflow-x: hidden;

        }



        /* Ambient Background Glow */

        .ambient-glow {

            position: fixed;

            top: -20%;

            left: -10%;

            width: 70vw;

            height: 70vw;

            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 60%);

            border-radius: 50%;

            pointer-events: none;

            z-index: -1;

            filter: blur(60px);

        }



        /* --- Header & Dashboard --- */

        header {

            position: sticky;

            top: 0;

            z-index: 100;

            background: var(--glass-bg);

            backdrop-filter: blur(16px);

            -webkit-backdrop-filter: blur(16px);

            border-bottom: 1px solid var(--border);

            padding: 20px 5%;

        }



        .header-content {

            max-width: 1200px;

            margin: 0 auto;

            display: flex;

            justify-content: space-between;

            align-items: center;

            flex-wrap: wrap;

            gap: 20px;

        }



        .brand h1 {

            font-family: var(--font-head);

            font-size: 2rem;

            font-weight: 800;

            letter-spacing: -0.5px;

            background: linear-gradient(to right, #fff, var(--text-muted));

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

        }



        .brand span {

            color: var(--accent-primary);

            -webkit-text-fill-color: var(--accent-primary);

        }



        /* Master Progress Bar */

        .master-stats {

            flex: 1;

            min-width: 300px;

            max-width: 500px;

        }



        .stat-header {

            display: flex;

            justify-content: space-between;

            margin-bottom: 8px;

            font-size: 0.9rem;

            font-weight: 600;

        }



        .stat-header .percent {

            color: var(--accent-primary);

            font-family: var(--font-head);

            font-size: 1.1rem;

        }



        .progress-track {

            width: 100%;

            height: 10px;

            background: var(--bg-surface-hover);

            border-radius: 8px;

            overflow: hidden;

            border: 1px solid var(--border);

        }



        .progress-fill {

            height: 100%;

            background: var(--accent-primary);

            width: 0%;

            transition: width 1s cubic-bezier(0.1, 0.8, 0.3, 1);

            box-shadow: 0 0 10px var(--accent-primary);

        }



        .actions {

            display: flex;

            gap: 12px;

        }



        .btn {

            background: var(--bg-surface);

            color: var(--text-main);

            border: 1px solid var(--border);

            padding: 10px 20px;

            border-radius: 8px;

            font-family: var(--font-sans);

            font-weight: 500;

            font-size: 0.9rem;

            cursor: pointer;

            transition: var(--transition);

        }



        .btn:hover {

            background: var(--bg-surface-hover);

            border-color: var(--text-muted);

        }



        .btn-danger {

            color: var(--danger);

            border-color: rgba(239, 68, 68, 0.3);

        }



        .btn-danger:hover {

            background: rgba(239, 68, 68, 0.1);

            border-color: var(--danger);

        }



        /* --- Main Content --- */

        main {

            max-width: 1200px;

            margin: 40px auto;

            padding: 0 5%;

        }



        .category-grid {

            display: grid;

            gap: 24px;

        }



        /* Category Card */

        .category-card {

            background: rgba(24, 24, 27, 0.4);

            border: 1px solid var(--border);

            border-radius: 12px;

            overflow: hidden;

            transition: var(--transition);

        }



        .category-card:hover {

            border-color: #52525b;

            background: rgba(24, 24, 27, 0.8);

        }



        .category-header {

            padding: 20px 24px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            cursor: pointer;

            user-select: none;

        }



        .category-info h2 {

            font-family: var(--font-head);

            font-size: 1.3rem;

            font-weight: 700;

            margin-bottom: 6px;

        }



        .category-meta {

            font-size: 0.85rem;

            color: var(--text-muted);

            display: flex;

            align-items: center;

            gap: 12px;

        }



        .cat-progress-track {

            width: 100px;

            height: 6px;

            background: var(--bg-surface-hover);

            border-radius: 4px;

            overflow: hidden;

        }



        .cat-progress-fill {

            height: 100%;

            background: var(--accent-primary);

            width: 0%;

            transition: width 0.5s ease;

        }



        .toggle-icon {

            transition: transform 0.3s ease;

            color: var(--text-muted);

        }



        .category-card.active .toggle-icon {

            transform: rotate(180deg);

        }



        /* Problem List */

        .problem-list {

            display: none;

            border-top: 1px solid var(--border);

            background: rgba(0, 0, 0, 0.2);

        }



        .category-card.active .problem-list {

            display: block;

            animation: slideDown 0.3s ease forwards;

        }



        .problem-item {

            display: grid;

            grid-template-columns: auto 1fr auto;

            gap: 16px;

            align-items: center;

            padding: 16px 24px;

            border-bottom: 1px solid rgba(255, 255, 255, 0.05);

            transition: background 0.2s;

        }



        .problem-item:last-child {

            border-bottom: none;

        }



        .problem-item:hover {

            background: rgba(255, 255, 255, 0.03);

        }



        .problem-item.completed .problem-name {

            text-decoration: line-through;

            color: var(--text-muted);

        }



        /* Custom Checkbox */

        .custom-checkbox {

            appearance: none;

            width: 22px;

            height: 22px;

            border: 2px solid var(--text-muted);

            border-radius: 6px;

            cursor: pointer;

            position: relative;

            background: transparent;

            outline: none;

            transition: var(--transition);

            display: grid;

            place-items: center;

        }



        .custom-checkbox:checked {

            background: var(--accent-primary);

            border-color: var(--accent-primary);

        }



        .custom-checkbox:checked::before {

            content: "";

            width: 5px;

            height: 10px;

            border: solid var(--bg-base);

            border-width: 0 2px 2px 0;

            transform: rotate(45deg);

            margin-bottom: 2px;

        }



        .problem-name {

            color: var(--text-main);

            text-decoration: none;

            font-weight: 500;

            font-size: 1rem;

            transition: color 0.2s;

        }



        .problem-name:hover {

            color: var(--accent-primary);

        }



        .lc-badge {

            background: rgba(248, 159, 27, 0.1);

            color: #f89f1b;

            padding: 4px 10px;

            border-radius: 4px;

            font-size: 0.75rem;

            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: 0.5px;

            border: 1px solid rgba(248, 159, 27, 0.2);

        }



        @keyframes slideDown {

            from { opacity: 0; transform: translateY(-10px); }

            to { opacity: 1; transform: translateY(0); }

        }



        @media (max-width: 768px) {

            .header-content { flex-direction: column; align-items: stretch; }

            .master-stats { max-width: 100%; }

            .actions { justify-content: flex-end; }

        }

</head>

                { name: "Gas Station", link: "https://leetcode.com/problems/gas-station/" },

                { name: "Hand of Straights", link: "https://leetcode.com/problems/hand-of-straights/" },

                { name: "Merge Triplets to Form Target Triplet", link: "https://leetcode.com/problems/merge-triplets-to-form-target-triplet/" },

                { name: "Partition Labels", link: "https://leetcode.com/problems/partition-labels/" },

                { name: "Valid Parenthesis String", link: "https://leetcode.com/problems/valid-parenthesis-string/" }

            ]

        },

        {

            name: "Intervals",

            problems: [

                { name: "Insert Interval", link: "https://leetcode.com/problems/insert-interval/" },

                { name: "Merge Intervals", link: "https://leetcode.com/problems/merge-intervals/" },

                { name: "Non-Overlapping Intervals", link: "https://leetcode.com/problems/non-overlapping-intervals/" },

                { name: "Meeting Rooms", link: "https://leetcode.com/problems/meeting-rooms/" },

                { name: "Meeting Rooms II", link: "https://leetcode.com/problems/meeting-rooms-ii/" },

                { name: "Minimum Interval to Include Each Query", link: "https://leetcode.com/problems/minimum-interval-to-include-each-query/" }

            ]

        },

        {

            name: "Math & Geometry",

            problems: [

                { name: "Rotate Image", link: "https://leetcode.com/problems/rotate-image/" },

                { name: "Spiral Matrix", link: "https://leetcode.com/problems/spiral-matrix/" },

                { name: "Set Matrix Zeroes", link: "https://leetcode.com/problems/set-matrix-zeroes/" },

                { name: "Happy Number", link: "https://leetcode.com/problems/happy-number/" },

                { name: "Plus One", link: "https://leetcode.com/problems/plus-one/" },

                { name: "Pow(x, n)", link: "https://leetcode.com/problems/powx-n/" },

                { name: "Multiply Strings", link: "https://leetcode.com/problems/multiply-strings/" },

                { name: "Detect Squares", link: "https://leetcode.com/problems/detect-squares/" }

            ]

        },

        {

            name: "Bit Manipulation",

            problems: [

                { name: "Single Number", link: "https://leetcode.com/problems/single-number/" },

                { name: "Number of 1 Bits", link: "https://leetcode.com/problems/number-of-1-bits/" },

                { name: "Counting Bits", link: "https://leetcode.com/problems/counting-bits/" },

                { name: "Reverse Bits", link: "https://leetcode.com/problems/reverse-bits/" },

                { name: "Missing Number", link: "https://leetcode.com/problems/missing-number/" },

                { name: "Sum of Two Integers", link: "https://leetcode.com/problems/sum-of-two-integers/" },

                { name: "Reverse Integer", link: "https://leetcode.com/problems/reverse-integer/" }

            ]

        }

    ];



    // Ensure a fresh start by using a specific storage key for this version

    const STORAGE_KEY = 'premium_faang_dsa_tracker_v1';

    let progressData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};



    // DOM Elements

    const container = document.getElementById('category-container');

    const globalCountEl = document.getElementById('global-count');

    const globalPercentEl = document.getElementById('global-percent');

    const globalFillEl = document.getElementById('global-fill');



    function init() {

        renderUI();

        updateGlobalStats();

    }



    function renderUI() {

        container.innerHTML = '';



        dsaData.forEach((category, catIndex) => {

            // Calculate initial category stats

            const total = category.problems.length;

            let solved = 0;

            category.problems.forEach((prob, probIndex) => {

                if (progressData[`${catIndex}-${probIndex}`]) solved++;

            });

            const percent = Math.round((solved / total) * 100) || 0;



            // Create Category Card

            const card = document.createElement('div');

            card.className = 'category-card';



            card.innerHTML = `

                <div class="category-header" onclick="toggleCategory(this)">

                    <div class="category-info">

                        <h2>${category.name}</h2>

                        <div class="category-meta">

                            <span id="cat-count-${catIndex}">${solved} / ${total}</span>

                            <div class="cat-progress-track">

                                <div class="cat-progress-fill" id="cat-fill-${catIndex}" style="width: ${percent}%"></div>

                            </div>

                        </div>

                    </div>

                    <svg class="toggle-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                        <polyline points="6 9 12 15 18 9"></polyline>

                    </svg>

                </div>

                <div class="problem-list">

                    ${category.problems.map((prob, probIndex) => {

                        const isChecked = progressData[`${catIndex}-${probIndex}`] ? 'checked' : '';

                        const completedClass = isChecked ? 'completed' : '';



                        return `

                            <div class="problem-item ${completedClass}" id="row-${catIndex}-${probIndex}">

                                <input type="checkbox" class="custom-checkbox"

                                    ${isChecked}

                                    onchange="toggleProblem(${catIndex}, ${probIndex}, this.checked)">

                                <a href="${prob.link}" target="_blank" class="problem-name">${prob.name}</a>

                                <span class="lc-badge">LeetCode</span>

                            </div>

                        `;

                    }).join('')}

                </div>

            `;

            container.appendChild(card);

        });

    }



    function toggleCategory(element) {

        const card = element.parentElement;

        card.classList.toggle('active');

    }



    function toggleProblem(catIndex, probIndex, isCompleted) {

        // Update Data

        if (isCompleted) {

            progressData[`${catIndex}-${probIndex}`] = true;

        } else {

            delete progressData[`${catIndex}-${probIndex}`];

        }



        // Save

        localStorage.setItem(STORAGE_KEY, JSON.stringify(progressData));



        // Visual Update for Row

        const row = document.getElementById(`row-${catIndex}-${probIndex}`);

        if (isCompleted) {

            row.classList.add('completed');

        } else {

            row.classList.remove('completed');

        }



        // Update Category Stats

        const category = dsaData[catIndex];

        const total = category.problems.length;

        let solved = 0;

        category.problems.forEach((_, pIdx) => {

            if (progressData[`${catIndex}-${pIdx}`]) solved++;

        });

        const percent = Math.round((solved / total) * 100) || 0;



        document.getElementById(`cat-count-${catIndex}`).innerText = `${solved} / ${total}`;

        document.getElementById(`cat-fill-${catIndex}`).style.width = `${percent}%`;



        // Update Global Stats

        updateGlobalStats();

    }



    function updateGlobalStats() {

        let totalProblems = 0;

        let totalSolved = 0;



        dsaData.forEach((category, cIdx) => {

            totalProblems += category.problems.length;

            category.problems.forEach((_, pIdx) => {

                if (progressData[`${cIdx}-${pIdx}`]) totalSolved++;

            });

        });



        const overallPercent = Math.round((totalSolved / totalProblems) * 100) || 0;



        globalCountEl.innerText = `${totalSolved} / ${totalProblems} Solved`;

        globalPercentEl.innerText = `${overallPercent}%`;

        globalFillEl.style.width = `${overallPercent}%`;

    }



    function resetProgress() {

        if (confirm("Are you sure you want to completely reset your progress? This will return your completion to 0% and cannot be undone.")) {

            progressData = {};

            localStorage.removeItem(STORAGE_KEY);

            init();

        }

    }



    // Initialize application on load

    window.onload = init;

</script>

</body>

</html>
