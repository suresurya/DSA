<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAANG DSA Tracker | 30-Day Plan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
          --bg-base: #09090b;
          --bg-surface: #18181b;
          --bg-surface-2: #1e1e21;
          --bg-hover: #27272a;
          --glass-bg: rgba(18,18,21,0.8);
          --border: #3f3f46;
          --border-light: rgba(255,255,255,0.06);
          --text-main: #f4f4f5;
          --text-muted: #a1a1aa;
          --text-dim: #71717a;
          --accent: #10b981;
          --accent-glow: rgba(16,185,129,0.18);
          --accent-dim: rgba(16,185,129,0.08);
          --danger: #ef4444;
          --lc-color: #f89f1b;
          --gfg-color: #2f8d46;
          --hr-color: #00ea64;
          --easy: #4ade80;
          --med: #fbbf24;
          --hard: #f87171;
          --font: 'Inter', sans-serif;
          --font-head: 'Outfit', sans-serif;
          --font-mono: 'JetBrains Mono', monospace;
          --radius: 10px;
          --t: all 0.25s cubic-bezier(0.4,0,0.2,1);
        }
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior: smooth; }
        body {
          background: var(--bg-base);
          color: var(--text-main);
          font-family: var(--font);
          line-height: 1.6;
          -webkit-font-smoothing: antialiased;
          overflow-x: hidden;
          padding-bottom: 80px;
        }

        /* ── AMBIENT GLOWS ── */
        .glow-tl {
          position:fixed; top:-15%; left:-10%;
          width:60vw; height:60vw;
          background: radial-gradient(circle, var(--accent-glow) 0%, transparent 65%);
          border-radius:50%; pointer-events:none; z-index:-1; filter:blur(70px);
        }
        .glow-br {
          position:fixed; bottom:-10%; right:-10%;
          width:40vw; height:40vw;
          background: radial-gradient(circle, rgba(139,92,246,0.07) 0%, transparent 65%);
          border-radius:50%; pointer-events:none; z-index:-1; filter:blur(60px);
        }

        /* ── HEADER ── */
        header {
          position:sticky; top:0; z-index:200;
          background: var(--glass-bg);
          backdrop-filter: blur(20px);
          -webkit-backdrop-filter: blur(20px);
          border-bottom: 1px solid var(--border);
          padding: 18px 5%;
        }
        .header-inner {
          max-width:1300px; margin:0 auto;
          display:flex; align-items:center; gap:20px; flex-wrap:wrap;
        }
        .brand { display:flex; align-items:baseline; gap:6px; }
        .brand h1 {
          font-family:var(--font-head); font-size:1.7rem; font-weight:900;
          letter-spacing:-0.5px;
          background: linear-gradient(135deg,#fff 0%, #a1a1aa 100%);
          -webkit-background-clip:text; -webkit-text-fill-color:transparent;
        }
        .brand h1 em {
          color:var(--accent); -webkit-text-fill-color:var(--accent);
          font-style:normal;
        }

        /* Mini stat pills */
        .header-stats { display:flex; gap:8px; flex-wrap:wrap; margin-left:auto; }
        .hstat {
          display:flex; align-items:center; gap:6px;
          background: var(--bg-surface); border:1px solid var(--border);
          border-radius:20px; padding:5px 12px; font-size:0.78rem; font-weight:600;
        }
        .hstat-dot { width:8px; height:8px; border-radius:50%; }
        .hstat-dot.lc { background:var(--lc-color); }
        .hstat-dot.gfg { background:var(--gfg-color); }
        .hstat-dot.hr { background:var(--hr-color); }

        /* Progress bar in header */
        .header-progress { width:100%; }
        .hp-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:7px; font-size:0.85rem; font-weight:600; }
        .hp-pct { color:var(--accent); font-family:var(--font-head); font-size:1rem; }
        .hp-track { width:100%; height:7px; background:var(--bg-hover); border-radius:6px; overflow:hidden; border:1px solid var(--border); }
        .hp-fill { height:100%; background:linear-gradient(90deg,var(--accent),#34d399); width:0%; transition:width 0.9s cubic-bezier(0.1,0.8,0.3,1); box-shadow:0 0 8px var(--accent); }

        /* ── TAB NAV ── */
        .tab-nav {
          background: var(--glass-bg);
          backdrop-filter:blur(12px);
          border-bottom:1px solid var(--border);
          padding:0 5%;
          display:flex; gap:0; align-items:center;
          position:sticky; top:73px; z-index:150;
        }
        .tab-btn {
          background:transparent; border:none; color:var(--text-muted);
          padding:14px 22px; font-family:var(--font); font-size:0.88rem; font-weight:600;
          cursor:pointer; transition:var(--t); border-bottom:2px solid transparent;
          letter-spacing:0.3px;
        }
        .tab-btn:hover { color:var(--text-main); }
        .tab-btn.active { color:var(--accent); border-bottom-color:var(--accent); }
        .filter-group { display:flex; gap:8px; margin-left:auto; padding:10px 0; }
        .fbtn {
          background:transparent; border:1px solid var(--border); color:var(--text-muted);
          padding:6px 14px; border-radius:6px; font-family:var(--font); font-size:0.8rem; font-weight:600;
          cursor:pointer; transition:var(--t);
        }
        .fbtn:hover { color:var(--text-main); border-color:#52525b; }
        .fbtn.active { background:var(--text-main); color:var(--bg-base); border-color:var(--text-main); }
        .fbtn-danger { color:var(--danger); border-color:rgba(239,68,68,0.3); }
        .fbtn-danger:hover { background:rgba(239,68,68,0.08); border-color:var(--danger); }

        /* ── MAIN ── */
        main { max-width:1300px; margin:0 auto; padding:36px 5%; }

        /* ── PANELS ── */
        .panel { display:none; }
        .panel.active { display:block; }

        /* ─── 30-DAY PANEL ─── */
        .week-section { margin-bottom:48px; }
        .week-header {
          display:flex; align-items:center; gap:14px; margin-bottom:16px; padding-bottom:12px;
          border-bottom:1px solid var(--border-light);
        }
        .week-chip {
          font-family:var(--font-mono); font-size:0.72rem; font-weight:600;
          padding:5px 10px; border-radius:5px; border:1px solid var(--border);
          color:var(--text-dim); background:var(--bg-surface); text-transform:uppercase; letter-spacing:1px;
        }
        .week-title { font-family:var(--font-head); font-size:1.35rem; font-weight:700; }
        .week-sub { font-size:0.82rem; color:var(--text-muted); margin-left:auto; }

        /* Day Card */
        .day-card {
          background: var(--bg-surface);
          border:1px solid var(--border);
          border-radius:var(--radius);
          margin-bottom:10px;
          overflow:hidden;
          transition:var(--t);
        }
        .day-card:hover { border-color:#52525b; box-shadow:0 2px 16px rgba(0,0,0,0.3); }
        .day-card.complete { border-color:rgba(16,185,129,0.35); }
        .day-card.mock-day { border-color:rgba(251,191,36,0.25); }

        .day-header {
          display:grid;
          grid-template-columns:90px 1fr auto;
          align-items:stretch;
          cursor:pointer;
          user-select:none;
        }
        .day-num-box {
          background:rgba(255,255,255,0.02);
          border-right:1px solid var(--border);
          display:flex; flex-direction:column; align-items:center; justify-content:center;
          padding:18px 10px; text-align:center; gap:2px;
        }
        .day-num-label { font-size:0.62rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:1.5px; }
        .day-num-val { font-family:var(--font-mono); font-size:1.7rem; font-weight:700; color:var(--text-main); }
        .day-date { font-size:0.65rem; color:var(--accent); font-weight:600; text-transform:uppercase; letter-spacing:0.5px; margin-top:2px; }

        .day-info { padding:16px 20px; display:flex; flex-direction:column; justify-content:center; gap:4px; }
        .day-topic { font-size:1rem; font-weight:700; }
        .day-sub-text { font-size:0.8rem; color:var(--text-muted); }
        .day-tags { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
        .dtag {
          font-size:0.68rem; font-weight:700; padding:3px 8px; border-radius:4px;
          text-transform:uppercase; letter-spacing:0.4px;
        }
        .dtag-easy { background:rgba(74,222,128,0.08); color:var(--easy); border:1px solid rgba(74,222,128,0.2); }
        .dtag-med { background:rgba(251,191,36,0.08); color:var(--med); border:1px solid rgba(251,191,36,0.2); }
        .dtag-hard { background:rgba(248,113,113,0.08); color:var(--hard); border:1px solid rgba(248,113,113,0.2); }
        .dtag-theory { background:rgba(139,92,246,0.08); color:#a78bfa; border:1px solid rgba(139,92,246,0.2); }
        .dtag-mock { background:rgba(251,191,36,0.08); color:var(--med); border:1px solid rgba(251,191,36,0.2); }

        .day-toggle { padding:0 20px; display:flex; align-items:center; color:var(--text-dim); transition:transform 0.3s; }
        .day-card.open .day-toggle { transform:rotate(180deg); }

        .day-body { display:none; border-top:1px solid var(--border); background:#0a0a0c; }
        .day-card.open .day-body { display:block; animation:slideDown 0.25s ease-out; }
        @keyframes slideDown { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }

        /* Theory/Java notes */
        .day-note {
          margin:16px 20px; padding:14px 18px;
          border-radius:6px; font-size:0.85rem;
        }
        .day-note-theory {
          background:rgba(139,92,246,0.06); border-left:3px solid #7c3aed;
        }
        .day-note-theory strong { color:#a78bfa; display:block; font-size:0.7rem; text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; }
        .day-note-mock {
          background:rgba(251,191,36,0.05); border-left:3px solid var(--med);
        }
        .day-note-mock strong { color:var(--med); display:block; font-size:0.7rem; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }

        /* Problem group header */
        .prob-group-lbl {
          padding:8px 20px; font-size:0.72rem; font-weight:700; text-transform:uppercase;
          letter-spacing:1px; color:var(--text-dim);
          border-top:1px solid var(--border-light); border-bottom:1px solid var(--border-light);
          background:rgba(255,255,255,0.015);
        }

        /* Problem row */
        .prob-row {
          display:grid;
          grid-template-columns:40px 38px 1fr auto;
          align-items:center; gap:12px;
          padding:12px 20px;
          border-bottom:1px solid var(--border-light);
          transition:background 0.15s;
        }
        .prob-row:last-child { border-bottom:none; }
        .prob-row:hover { background:rgba(255,255,255,0.025); }
        .prob-row.done .prob-name { text-decoration:line-through; color:var(--text-muted); }

        /* Source badge */
        .src-badge {
          font-size:0.62rem; font-weight:800; padding:3px 5px; border-radius:4px;
          text-align:center; letter-spacing:0.3px;
        }
        .src-lc { background:rgba(248,159,27,0.12); color:var(--lc-color); }
        .src-gfg { background:rgba(47,141,70,0.12); color:var(--gfg-color); }
        .src-hr { background:rgba(0,234,100,0.12); color:var(--hr-color); }

        .prob-name {
          color:var(--text-main); text-decoration:none;
          font-size:0.9rem; font-weight:500; transition:color 0.2s;
        }
        .prob-name:hover { color:var(--accent); }

        /* Diff badge */
        .diff-badge { font-size:0.72rem; font-weight:700; padding:3px 9px; border-radius:10px; }
        .diff-Easy { color:var(--easy); background:rgba(74,222,128,0.08); }
        .diff-Medium { color:var(--med); background:rgba(251,191,36,0.08); }
        .diff-Hard { color:var(--hard); background:rgba(248,113,113,0.08); }

        /* Checkbox */
        .custom-cb {
          appearance:none; width:20px; height:20px;
          border:2px solid var(--text-dim); border-radius:5px;
          cursor:pointer; background:transparent; outline:none; transition:var(--t);
          position:relative; display:grid; place-items:center;
        }
        .custom-cb:checked { background:var(--accent); border-color:var(--accent); }
        .custom-cb:checked::before {
          content:""; width:4px; height:9px;
          border:solid #000; border-width:0 2px 2px 0;
          transform:rotate(45deg); margin-bottom:1px;
        }
        .custom-cb:hover:not(:checked) { border-color:var(--accent); }

        /* ─── TOPIC PANEL ─── */
        .cat-grid { display:grid; gap:16px; }
        .cat-card {
          background:rgba(24,24,27,0.4); border:1px solid var(--border);
          border-radius:var(--radius); overflow:hidden; transition:var(--t);
        }
        .cat-card:hover { border-color:#52525b; background:rgba(24,24,27,0.75); }
        .cat-header {
          padding:18px 22px; display:flex; align-items:center; justify-content:space-between;
          cursor:pointer; user-select:none; gap:16px;
        }
        .cat-info h2 { font-family:var(--font-head); font-size:1.2rem; font-weight:700; margin-bottom:5px; }
        .cat-meta { display:flex; align-items:center; gap:12px; font-size:0.82rem; color:var(--text-muted); font-weight:500; }
        .cat-bar-track { width:90px; height:5px; background:var(--bg-hover); border-radius:4px; overflow:hidden; }
        .cat-bar-fill { height:100%; background:var(--accent); border-radius:4px; transition:width 0.5s ease; }
        .cat-card.open .cat-toggle { transform:rotate(180deg); }
        .cat-toggle { transition:transform 0.3s; color:var(--text-dim); flex-shrink:0; }
        .cat-prob-list { display:none; border-top:1px solid var(--border); background:rgba(0,0,0,0.18); }
        .cat-card.open .cat-prob-list { display:block; animation:slideDown 0.25s ease-out; }
        .cat-prob-row {
          display:grid; grid-template-columns:40px 1fr auto auto;
          align-items:center; gap:14px; padding:14px 22px;
          border-bottom:1px solid var(--border-light); transition:background 0.15s;
        }
        .cat-prob-row:last-child { border-bottom:none; }
        .cat-prob-row:hover { background:rgba(255,255,255,0.025); }
        .cat-prob-row.done .cat-prob-name { text-decoration:line-through; color:var(--text-muted); }
        .cat-prob-name {
          color:var(--text-main); text-decoration:none;
          font-size:0.93rem; font-weight:500; transition:color 0.2s;
        }
        .cat-prob-name:hover { color:var(--accent); }

        /* ── TOAST ── */
        #toast {
          visibility:hidden; min-width:220px; max-width:300px;
          background:var(--bg-surface); border:1px solid rgba(16,185,129,0.3);
          color:var(--accent); text-align:center; border-radius:8px; padding:14px 20px;
          position:fixed; z-index:999; left:50%; bottom:30px; transform:translateX(-50%);
          font-weight:600; font-size:0.85rem; box-shadow:0 4px 20px rgba(0,0,0,0.5);
          display:flex; align-items:center; justify-content:center; gap:8px;
        }
        #toast.show { visibility:visible; animation:fadeIn 0.4s, fadeOut 0.4s 2.3s; }
        @keyframes fadeIn { from{bottom:0;opacity:0} to{bottom:30px;opacity:1} }
        @keyframes fadeOut { from{bottom:30px;opacity:1} to{bottom:0;opacity:0} }

        /* ── RESPONSIVE ── */
        @media(max-width:768px) {
          .header-inner { flex-direction:column; align-items:stretch; }
          .header-stats { margin-left:0; }
          .day-header { grid-template-columns:72px 1fr 36px; }
          .prob-row { grid-template-columns:30px 32px 1fr; }
          .diff-badge { display:none; }
          .tab-nav { flex-wrap:wrap; top:auto; position:relative; }
          .filter-group { flex-wrap:wrap; }
        }
    </style>
</head>
<body>
<div class="glow-tl"></div>
<div class="glow-br"></div>

<!-- HEADER -->
<header>
    <div class="header-inner">
        <div class="brand"><h1>FAANG <em>DSA</em> Tracker</h1></div>
        <div class="header-stats">
            <div class="hstat"><span class="hstat-dot lc"></span><span id="h-lc">0</span> LC</div>
            <div class="hstat"><span class="hstat-dot gfg"></span><span id="h-gfg">0</span> GFG</div>
            <div class="hstat"><span class="hstat-dot hr"></span><span id="h-hr">0</span> HR</div>
        </div>
        <div class="header-progress" style="width:100%">
            <div class="hp-row">
                <span id="h-count">0 / 0 Solved</span>
                <span class="hp-pct" id="h-pct">0%</span>
            </div>
            <div class="hp-track"><div class="hp-fill" id="h-fill"></div></div>
        </div>
    </div>
</header>

<!-- TAB NAV -->
<div class="tab-nav">
    <button class="tab-btn active" onclick="switchTab('plan',this)">📅 30-Day Plan</button>
    <button class="tab-btn" onclick="switchTab('topic',this)">🗂️ By Topic</button>
    <div class="filter-group" id="filter-group">
        <button class="fbtn active" onclick="setFilter('all',this)">All</button>
        <button class="fbtn" onclick="setFilter('pending',this)">Pending</button>
        <button class="fbtn" onclick="setFilter('done',this)">Completed</button>
        <button class="fbtn fbtn-danger" onclick="resetAll()">Reset</button>
    </div>
</div>

<main>
    <!-- 30-DAY PANEL -->
    <div class="panel active" id="panel-plan">
        <div id="plan-container"></div>
    </div>
    <!-- TOPIC PANEL -->
    <div class="panel" id="panel-topic">
        <div class="cat-grid" id="topic-container"></div>
    </div>
</main>

<div id="toast">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
    Saved!
</div>

<script>
    // ─── STORAGE ───
    const SK = 'faang_dsa_v3';
    let P = JSON.parse(localStorage.getItem(SK)) || {};

    function save() { localStorage.setItem(SK, JSON.stringify(P)); }
    function pkey(day, gi, pi) { return `d${day}_g${gi}_p${pi}`; }
    function topicKey(ci, pi) { return `t${ci}_p${pi}`; }
    function isDone(k) { return !!P[k]; }
    function setDone(k, v) { if(v) P[k]=1; else delete P[k]; save(); }

    // ─── START DATE ───
    let startIso = localStorage.getItem('faang_start');
    if (!startIso) { startIso = new Date().toISOString(); localStorage.setItem('faang_start',startIso); }
    const startDate = new Date(startIso);

    function dayDateStr(dayIdx) {
      const d = new Date(startDate);
      d.setDate(d.getDate() + dayIdx - 1);
      const today = new Date();
      const isToday = d.toDateString() === today.toDateString();
      const s = d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
      return isToday ? `⭐ TODAY` : s;
    }

    // ─── 30-DAY PLAN DATA ───
    function lc(n,s,d){ return {n,src:'LC',url:`https://leetcode.com/problems/${s}/`,d}; }
    function gfg(n,s,d){ return {n,src:'GFG',url:`https://practice.geeksforgeeks.org/problems/${s}/`,d}; }
    function hr(n,s,d){ return {n,src:'HR',url:`https://www.hackerrank.com/challenges/${s}/problem`,d}; }

    const PLAN = [
      // ── WEEK 1 ──
      { week:1, title:'Arrays — Foundation', sub:'Basics · Two Pointers · Sliding Window · Prefix Sums · Matrix · Bitwise', days:[
        { day:1, topic:'Array Basics & Brute Force', sub:'Indexing, traversal, XOR tricks, Java primitives', theory:'Number Systems · Data Representation · Armstrong/Prime numbers · Array Traversal & Reverse',
          groups:[
            { lbl:'LeetCode', probs:[ lc('Two Sum','two-sum','Easy'), lc('Contains Duplicate','contains-duplicate','Easy'), lc('Maximum Subarray','maximum-subarray','Easy'), lc('Single Number','single-number','Easy'), lc('Max Consecutive Ones','max-consecutive-ones','Easy'), lc('Missing Number','missing-number','Easy'), lc('Check Array Sorted & Rotated','check-if-array-is-sorted-and-rotated','Easy'), lc('Rearrange Array by Sign','rearrange-array-elements-by-sign','Medium') ]},
            { lbl:'GeeksForGeeks', probs:[ gfg('Check if Array is Sorted','check-if-array-is-sorted','Easy'), gfg('Count Digits of a Number','count-digits','Easy'), gfg('Sum of All Divisors 1 to N','sum-of-all-divisors-from-1-to-n','Easy'), gfg('Armstrong Number','armstrong-number','Easy'), gfg('Find Element Appears Once','find-element-that-appears-once','Easy'), gfg('Leaders in Array','leaders-in-an-array','Easy'), gfg('Equilibrium Point','equilibrium-point','Easy') ]},
            { lbl:'HackerRank', probs:[ hr('Arrays - DS','arrays-ds','Easy'), hr('Left Rotation','ctci-array-left-rotation','Easy'), hr('Missing Numbers','missing-numbers','Easy'), hr('Designer PDF Viewer','designer-pdf-viewer','Easy'), hr('Diagonal Difference','diagonal-difference','Easy') ]}
          ]
        },
        { day:2, topic:'Two Pointer Technique', sub:'Opposite ends, fast-slow, pairs, triplets, in-place', theory:'Array Operations: Insert, Delete, Retrieve, Reverse · Linear Search & IndexOf',
          groups:[

    // ─── CURRENT TAB & FILTER ───
    let currentTab = 'plan';
    let currentFilter = 'all';

    function switchTab(tab, el) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.getElementById('panel-'+tab).classList.add('active');
      applyFilter(currentFilter);
    }

    function setFilter(f, el) {
      currentFilter = f;
      document.querySelectorAll('.fbtn:not(.fbtn-danger)').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      applyFilter(f);
    }

    function applyFilter(f) {
      if (currentTab === 'plan') {
        document.querySelectorAll('.day-card').forEach(card => {
          if (card.dataset.mock === 'true') { card.style.display='block'; return; }
          if (f === 'all') { card.style.display='block'; return; }
          const all = card.querySelectorAll('.custom-cb');
          const checked = card.querySelectorAll('.custom-cb:checked');
          if (f === 'done') card.style.display = (all.length && all.length === checked.length) ? 'block' : 'none';
          else card.style.display = (checked.length < all.length || !all.length) ? 'block' : 'none';
        });
      } else {
        document.querySelectorAll('.cat-card').forEach(card => {
          if (f === 'all') { card.style.display='block'; return; }
          const all = card.querySelectorAll('.custom-cb');
          const checked = card.querySelectorAll('.custom-cb:checked');
          if (f === 'done') card.style.display = (all.length && all.length === checked.length) ? 'block' : 'none';
          else card.style.display = (checked.length < all.length) ? 'block' : 'none';
        });
      }
    }

    // ─── RENDER 30-DAY PLAN ───
    function renderPlan() {
      const container = document.getElementById('plan-container');
      let html = '';
      PLAN.forEach(week => {
        html += `<div class="week-section">
          <div class="week-header">
            <span class="week-chip">Week ${week.week}</span>
            <h2 class="week-title">${week.title}</h2>
            <span class="week-sub">${week.sub}</span>
          </div>`;
        week.days.forEach(day => {
          const isMock = !!day.mock;
          let totCount = 0, doneCount = 0, easy=0, med=0, hard=0;
          if (!isMock && day.groups) {
            day.groups.forEach((g, gi) => g.probs.forEach((p, pi) => {
              totCount++;
              if (isDone(pkey(day.day,gi,pi))) doneCount++;
              if (p.d==='Easy') easy++;
              if (p.d==='Medium') med++;
              if (p.d==='Hard') hard++;
            }));
          }
          const isComplete = totCount > 0 && totCount === doneCount;
          html += `<div class="day-card ${isMock ? 'mock-day' : ''} ${isComplete ? 'complete' : ''}" id="dcard-${day.day}" data-mock="${isMock}">
            <div class="day-header" onclick="toggleDay(${day.day})">
              <div class="day-num-box">
                <span class="day-num-label">Day</span>
                <span class="day-num-val">${String(day.day).padStart(2,'0')}</span>
                <span class="day-date">${dayDateStr(day.day)}</span>
              </div>
              <div class="day-info">
                <div class="day-topic">${day.topic}</div>
                <div class="day-sub-text">${day.sub}</div>
                <div class="day-tags">`;
          if (isMock) { html += `<span class="dtag dtag-mock">Mock Interview</span>`; }
          else {
            if (day.theory) html += `<span class="dtag dtag-theory">Theory</span>`;
            if (easy) html += `<span class="dtag dtag-easy">${easy} Easy</span>`;
            if (med) html += `<span class="dtag dtag-med">${med} Medium</span>`;
            if (hard) html += `<span class="dtag dtag-hard">${hard} Hard</span>`;
            if (totCount) html += `<span class="dtag" style="background:rgba(255,255,255,0.04);color:var(--text-muted);border:1px solid var(--border)">${doneCount}/${totCount}</span>`;
          }
          html += `</div></div>
              <div class="day-toggle"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></div>
            </div>
            <div class="day-body">`;
          if (isMock) {
            html += `<div class="day-note day-note-mock"><strong>📋 Instructions</strong>${day.mockInstructions.map(i=>`• ${i}<br>`).join('')}</div>`;
          } else {
            if (day.theory) html += `<div class="day-note day-note-theory"><strong>📚 Curriculum Reading</strong>${day.theory}</div>`;
            day.groups.forEach((g, gi) => {
              html += `<div class="prob-group-lbl">${g.lbl}</div>`;
              g.probs.forEach((p, pi) => {
                const k = pkey(day.day, gi, pi);
                const done = isDone(k);
                html += `<div class="prob-row ${done?'done':''}" id="pr-${k}">
                  <input type="checkbox" class="custom-cb" ${done?'checked':''} onchange="togglePlanProb(this,'${k}',${day.day})">
                  <span class="src-badge src-${p.src.toLowerCase()}">${p.src}</span>
                  <a href="${p.url}" target="_blank" class="prob-name">${p.n}</a>
                  <span class="diff-badge diff-${p.d}">${p.d}</span>
                </div>`;
              });
            });
          }
          html += `</div></div>`;
        });
        html += `</div>`;
      });
      container.innerHTML = html;
    }

    // ─── RENDER TOPICS ───
    function renderTopics() {
      const container = document.getElementById('topic-container');
      let html = '';
      TOPICS.forEach((cat, ci) => {
        const tot = cat.probs.length;
        let done = 0;
        cat.probs.forEach((_, pi) => { if(isDone(topicKey(ci,pi))) done++; });
        const pct = Math.round((done/tot)*100)||0;
        html += `<div class="cat-card" id="cat-${ci}">
          <div class="cat-header" onclick="toggleCat(${ci})">
            <div class="cat-info">
              <h2>${cat.name}</h2>
              <div class="cat-meta">
                <span id="ccount-${ci}">${done} / ${tot}</span>
                <div class="cat-bar-track"><div class="cat-bar-fill" id="cbar-${ci}" style="width:${pct}%"></div></div>
              </div>
            </div>
            <div class="cat-toggle" id="ctog-${ci}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></div>
          </div>
          <div class="cat-prob-list" id="clist-${ci}">`;
        cat.probs.forEach((p, pi) => {
          const k = topicKey(ci, pi);
          const done = isDone(k);
          html += `<div class="cat-prob-row ${done?'done':''}" id="cpr-${k}">
            <input type="checkbox" class="custom-cb" ${done?'checked':''} onchange="toggleTopicProb(this,'${k}',${ci})">
            <a href="${p.u}" target="_blank" class="cat-prob-name">${p.n}</a>
            <span class="src-badge src-lc">LC</span>

        });
        html += `</div></div>`;
      });
      container.innerHTML = html;
    }

    // ─── TOGGLE HELPERS ───
    function toggleDay(dayNum) {
      document.getElementById('dcard-'+dayNum).classList.toggle('open');
    }
    function toggleCat(ci) {
      const card = document.getElementById('cat-'+ci);
      card.classList.toggle('open');
      const list = document.getElementById('clist-'+ci);
      list.style.display = card.classList.contains('open') ? 'block' : 'none';
    }

    // ─── TOGGLE PROBLEM ───
    function togglePlanProb(cb, key, dayNum) {
      setDone(key, cb.checked);
      const row = document.getElementById('pr-'+key);
      cb.checked ? row.classList.add('done') : row.classList.remove('done');
      // update day card completion class
      const card = document.getElementById('dcard-'+dayNum);
      const all = card.querySelectorAll('.custom-cb');
      const chk = card.querySelectorAll('.custom-cb:checked');
      if (all.length && all.length === chk.length) card.classList.add('complete');
      else card.classList.remove('complete');
      updateGlobalStats();
      if (cb.checked) showToast();
    }
    function toggleTopicProb(cb, key, ci) {
      setDone(key, cb.checked);
      const row = document.getElementById('cpr-'+key);
      cb.checked ? row.classList.add('done') : row.classList.remove('done');
      // update category count
      const tot = TOPICS[ci].probs.length;
      let done = 0;
      TOPICS[ci].probs.forEach((_,pi) => { if(isDone(topicKey(ci,pi))) done++; });
      const pct = Math.round((done/tot)*100)||0;
      document.getElementById('ccount-'+ci).innerText = `${done} / ${tot}`;
      document.getElementById('cbar-'+ci).style.width = pct+'%';
      updateGlobalStats();
      if (cb.checked) showToast();
    }

    // ─── GLOBAL STATS ───
    function updateGlobalStats() {
      let total=0, done=0, lc=0, gfg=0, hr=0;
      PLAN.forEach(w => w.days.forEach(day => {
        if (!day.groups) return;
        day.groups.forEach((g, gi) => g.probs.forEach((p, pi) => {
          total++;
          if (isDone(pkey(day.day,gi,pi))) {
            done++;
            if (p.src==='LC') lc++;
            if (p.src==='GFG') gfg++;
            if (p.src==='HR') hr++;
          }
        }));
      }));
      const pct = total ? Math.round((done/total)*100) : 0;
      document.getElementById('h-count').innerText = `${done} / ${total} Solved`;
      document.getElementById('h-pct').innerText = pct+'%';
      document.getElementById('h-fill').style.width = pct+'%';
      document.getElementById('h-lc').innerText = lc;
      document.getElementById('h-gfg').innerText = gfg;
      document.getElementById('h-hr').innerText = hr;
    }

    // ─── TOAST ───
    function showToast() {
      const t = document.getElementById('toast');
      t.className = 'show';
      setTimeout(() => { t.className = t.className.replace('show',''); }, 2800);
    }

    // ─── RESET ───
    function resetAll() {
      if (confirm('⚠️ Reset ALL progress? This cannot be undone.')) {
        Object.keys(localStorage).forEach(k => {
          if (k === SK || k === 'faang_start') localStorage.removeItem(k);
        });
        P = {};
        localStorage.removeItem(SK);
        location.reload();
      }
    }

    // ─── INIT ───
    renderPlan();
    renderTopics();
    updateGlobalStats();
    // Hide cat lists initially
    TOPICS.forEach((_, ci) => { const el = document.getElementById('clist-'+ci); if(el) el.style.display='none'; });
</script>

<div id="toast">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
    Progress saved!
</div>
</body>
</html>
